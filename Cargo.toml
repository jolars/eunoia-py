[package]
name = "eunoia-py"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT"
repository = "https://github.com/jolars/eunoia-py"
description = "Python bindings for the eunoia area-proportional Euler/Venn diagram engine"
publish = false

[lib]
name = "_eunoia"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
eunoia = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
